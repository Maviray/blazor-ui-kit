name: Publish NuGet Packages

on:
  push:
    branches:
      - master
      - main
      - develop
      - 'feature/*alpha*'
      - 'hotfix/**'
  workflow_dispatch:
    inputs:
      force_version:
        description: 'Force specific version (optional, e.g., 1.2.3)'
        required: false

env:
  DOTNET_VERSION: '8.0.x'
  CONFIGURATION: 'Release'
  PACKAGES_PATH: '${{ github.workspace }}/artifacts'

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Install GitVersion
      uses: gittools/actions/gitversion/setup@v0.10.2
      with:
        versionSpec: '5.x'

    - name: Determine Version
      id: gitversion
      uses: gittools/actions/gitversion/execute@v0.10.2
      with:
        useConfigFile: true
        configFilePath: GitVersion.yml

    - name: Resolve Final Version
      id: version
      run: |
        CALCULATED_VERSION="${{ steps.gitversion.outputs.nuGetVersionV2 }}"
        BRANCH_NAME="${{ steps.gitversion.outputs.branchName }}"

        if [ "${{ github.event.inputs.force_version }}" != "" ]; then
          FINAL_VERSION="${{ github.event.inputs.force_version }}"
          echo "⚠️ Using forced version: $FINAL_VERSION"
        else
          FINAL_VERSION="$CALCULATED_VERSION"
        fi

        echo "version=$FINAL_VERSION" >> $GITHUB_OUTPUT
        echo "branch=$BRANCH_NAME" >> $GITHUB_OUTPUT
        echo "📦 Package Version: $FINAL_VERSION"
        echo "🌿 Branch: $BRANCH_NAME"

    - name: Restore dependencies
      run: dotnet restore

    - name: Build solution
      run: dotnet build -c ${{ env.CONFIGURATION }} --no-restore /p:Version=${{ steps.version.outputs.version }}

    - name: Run tests
      run: dotnet test -c ${{ env.CONFIGURATION }} --no-build --verbosity normal

    - name: Create packages directory
      run: mkdir -p ${{ env.PACKAGES_PATH }}

    - name: Pack NuGet packages
      run: |
        if [ ! -d "src" ]; then
          echo "⚠️ Warning: src directory not found. Skipping package creation."
          exit 0
        fi

        find src -name "*.csproj" | while read project; do
            echo "📦 Packing $project..."
            dotnet pack "$project" \
              -c ${{ env.CONFIGURATION }} \
              --no-build \
              --output ${{ env.PACKAGES_PATH }} \
              /p:PackageVersion=${{ steps.version.outputs.version }} \
              /p:Version=${{ steps.version.outputs.version }} \
              /p:RepositoryBranch="${{ steps.version.outputs.branch }}" \
              /p:RepositoryCommit=${{ github.sha }}
        done

    # ── NEW: Sign NuGet packages ──────────────────────────────────────────────
    - name: Install NuGet Sign tool
      run: dotnet tool install --global NuGetKeyVaultSignTool || dotnet tool install --global dotnet-sign 2>/dev/null || true

    - name: Decode certificate
      run: |
        echo "${{ secrets.NUGET_SIGNING_CERT_BASE64 }}" | base64 --decode > "${{ runner.temp }}/signing-cert.pfx"

    - name: Sign NuGet packages
      run: |
        for package in ${{ env.PACKAGES_PATH }}/*.nupkg; do
          echo "✍️ Signing $package..."
          dotnet nuget sign "$package" \
            --certificate-path "${{ runner.temp }}/signing-cert.pfx" \
            --certificate-password "${{ secrets.NUGET_SIGNING_CERT_PASSWORD }}" \
            --timestamper "http://timestamp.digicert.com" \
            --overwrite
        done

    - name: Clean up certificate
      if: always()
      run: rm -f "${{ runner.temp }}/signing-cert.pfx"
    # ─────────────────────────────────────────────────────────────────────────

    - name: Publish to NuGet.org
      run: |
        dotnet nuget push "${{ env.PACKAGES_PATH }}/*.nupkg" \
          --source "https://api.nuget.org/v3/index.json" \
          --api-key ${{ secrets.NUGET_API_KEY }} \
          --skip-duplicate

    - name: Create GitHub Release
      if: (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main') && steps.gitversion.outputs.preReleaseTag == ''
      uses: softprops/action-gh-release@v1
      with:
        tag_name: v${{ steps.version.outputs.version }}
        name: Release v${{ steps.version.outputs.version }}
        generate_release_notes: true
        files: ${{ env.PACKAGES_PATH }}/*.nupkg
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}